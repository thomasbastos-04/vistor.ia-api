services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vistoria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vistoria"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=vistoria;Username=postgres;Password=postgres
      Jwt__Key: local-development-key-change-before-production-12345
      App__FrontendUrl: http://localhost:4200
      Storage__Root: /app/uploads
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__From: no-reply@vistoria.local
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  postgres_data:
  uploads:
