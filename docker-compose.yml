services:
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: vistoria-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vistoria-api:local
    container_name: vistoria-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=host.docker.internal;Port=5432;Database=${POSTGRES_DB:-vistoria};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-LOCAL-DEVELOPMENT-KEY-VISTORIA-API-CHANGE-IN-PRODUCTION}
      Jwt__Issuer: ${JWT_ISSUER:-Vistor.ia}
      Jwt__Audience: ${JWT_AUDIENCE:-Vistor.ia.Client}
      App__FrontendUrl: ${FRONTEND_URL:-http://localhost:4200}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:4200}
      Storage__Root: /app/uploads
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__UseSsl: "false"
      Smtp__From: ${SMTP_FROM:-no-reply@vistoria.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mailpit
    restart: unless-stopped

volumes:
  uploads:
    name: vistoria-api-uploads
