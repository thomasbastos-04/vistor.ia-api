<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de vistoria</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F7F6;font-family:Arial,Helvetica,sans-serif;color:#17211F;">
  <div style="display:none;">Você recebeu uma solicitação para realizar uma vistoria.</div>

  <div style="max-width:600px;margin:32px auto;background:#fff;border-radius:8px;overflow:hidden;">
    <div style="padding:24px;background-color:{{PrimaryColor}};color:#fff;">
      {{#if LogoCid}}
        <img src="cid:{{LogoCid}}" width="150" alt="Vistor.ia" style="display:block;" />
      {{/if}}
      <h2 style="margin:0;">Vistor.ia</h2>
    </div>

    <div style="padding:24px;">
      <h1>Olá, {{RecipientName}}</h1>
      <p>Você recebeu uma solicitação para realizar uma vistoria.</p>
      <p style="text-align:center;"><a href="{{PublicUrl}}" style="background:{{SecondaryColor}};color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none;">Acessar vistoria</a></p>
      <p>O link expira em: {{Expiration}}</p>
    </div>
  </div>

  <p style="text-align:center;font-size:12px;color:#7A8380;">© {{Year}} Vistor.ia</p>
</body>
</html>
