name: CI - build and publish image

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          # Only push when workflow triggered by a direct push to the main branch
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vistoria-api:latest
            ghcr.io/${{ github.repository_owner }}/vistoria-api:${{ github.sha }}

  # Optional: deploy to Railway (manual step). To enable set RAILWAY_TOKEN and RAILWAY_ORG/PROJECT in repo secrets
